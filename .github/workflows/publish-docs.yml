name: CI Docs

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build-docs:
    if: github.repository == 'bambinos/bambi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.62.2
          environments: "dev"

      - name: Build documentation
        shell: bash
        run: |
          pixi run -e dev great-docs versions --check
          pixi run -e dev great-docs build
          touch docs/_site/.nojekyll

      - name: Save documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: pixi run -e dev great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/pr_number"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: ${{ runner.temp }}/pr_number

  publish-docs:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site
          include-hidden-files: true

      - name: Publish documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


# NOTES
# 1. The job runs only in the bambinos/bambi repository. It does not make sense to do it elsewhere.
# 2. Publish all configured versions from main so release tags cannot overwrite newer dev docs.
# 3. Pull requests and tags build the documentation without publishing it.
