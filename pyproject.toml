# ------------------------------------------------------------------------------------------------ #
#                                            Packaging                                             #
# ------------------------------------------------------------------------------------------------ #
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "setuptools_scm>=8"]

[tool.setuptools_scm]

[project]
name = "bambi"
description = "BAyesian Model Building Interface in Python"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
maintainers = [
    { name = "Tomás Capretto", email = "tomicapretto@gmail.com" },
    { name = "Osvaldo Martin", email = "aloctavodia@gmail.com" },
    { name = "Gabriel Stechschulte", email = "stechschulteg@gmail.com" },
    { name = "Ravin Kumar", email = "ravinsdrive@gmail.com" },
]

dependencies = [
    "arviz>=1.3.0,<2.0.0",
    "arviz_plots>=1.3.0,<2.0.0",
    "arviz_stats>=1.3.0,<2.0.0",
    "formulae>=0.7.0,<0.8.0",
    "graphviz",
    "matplotlib>=3.9.0,<4.0.0",
    "numpy",
    "pandas>=1.0.0",
    "pymc>=6.3.1,<7.0.0",
    "pytensor>=3.3.0,<4.0.0",
    "scipy",
    "seaborn>=0.13.2,<0.14",
    "xarray",
]

[project.optional-dependencies]
jax = [
    "blackjax>=1.5,<1.6", # I'd like to have >=1.6, but it fails due to mismatched args in pymc.
    "numpyro>=0.21,<0.22",
    "fastprogress",
]
nutpie = [
    "nutpie>=0.16.10,<1",
]

[project.urls]
homepage = "https://bambinos.github.io/bambi"
documentation = "https://bambinos.github.io/bambi"
repository = "https://github.com/bambinos/bambi"
changelog = "https://github.com/bambinos/bambi/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["bambi*"]


# ------------------------------------------------------------------------------------------------ #
#                                               Pixi                                               #
# ------------------------------------------------------------------------------------------------ #
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

# NOTE: Installs Bambi in editable mode
[tool.pixi.pypi-dependencies]
bambi = { path = ".", editable = true }

[tool.pixi.dependencies]
# NOTE: Even we get all dependencies we need through installation of Bambi itself
# Pixi's dual solver runs conda first.
numpy = "<2.5"

## Dependencies from conda channels
[tool.pixi.feature.dev.dependencies]
jupyterlab-lsp = ">=5.3.0,<6"
pre-commit = "4.*"
pylint = "3.3.*"
python-lsp-server = ">=1.15.0,<2"

[tool.pixi.feature.test.dependencies]
preliz = ">=0.27.1,<0.28"
pytest = ">=8,<9"
pytest-cov = ">=7,<8"
pytest-forked = ">=1.7.5,<2"
pytest-mock = ">=3.15.1,<4"

[tool.pixi.feature.docs.dependencies]
# quartodoc = ">=0.11,<0.12"
griffe = ">=1, <2"
ipykernel = ">=6.30,<7"
ipywidgets = ">=8.1.7,<9"
lifelines = ">=0.30.0,<0.31"
notebook = ">=7,<9"
preliz = ">=0.27.1,<0.28"
python-graphviz = ">=0.21,<0.22"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.5,<0.15"
watermark = ">=2.5.0,<3"

[tool.pixi.feature.dev.pypi-dependencies]
black = { version = ">=26.5.1, <27", extras = ["jupyter"] }

[tool.pixi.feature.docs.pypi-dependencies]
# We need a new release of quartodoc (after 0.11.1)
quartodoc = { git = "https://github.com/machow/quartodoc.git", rev = "fc9f3cca3c2f930e53c6c7079e41333a13ed0461" }

[tool.pixi.feature.jax.dependencies]
blackjax = ">=1.5,<1.6"
numpyro = ">=0.21,<0.22"
fastprogress = "*"

[tool.pixi.feature.nutpie.dependencies]
nutpie = ">=0.16.10,<1"

[tool.pixi.feature.py312.dependencies]
python = "~=3.12.0"

[tool.pixi.feature.py313.dependencies]
python = "~=3.13.0"

[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"


[tool.pixi.environments]
default = { solve-group = "default" }
# Only used for testing purposes
py312 = {features = ["dev", "test", "docs", "jax", "nutpie", "py312"]}
py313 = {features = ["dev", "test", "docs", "jax", "nutpie", "py313"]}
py314 = {features = ["dev", "test", "docs", "jax", "nutpie", "py314"]}

[tool.pixi.environments.dev]
features = ["dev", "test", "docs", "jax", "nutpie"]
solve-group = "default"

[tool.pixi.feature.dev.tasks]
pre-commit-setup = "pre-commit install"

# ------------------------------------------------------------------------------------------------ #
#                                          Other tooling                                           #
# ------------------------------------------------------------------------------------------------ #
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-p no:warnings"


[tool.pylint.main]
jobs = 0
ignore = ["tests"]
unsafe-load-any-extension = false


[tool.pylint.messages_control]
disable = [
  "cyclic-import",
  "missing-docstring",
  "no-else-return",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
  "use-implicit-booleaness-not-len",
]

[tool.pylint.format]
max-line-length = 100


[tool.pylint.variables]
dummy-variables-rgx = "_+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|^ignored_|^unused_"
ignored-argument-names = "_.*|^ignored_|^unused_"

# [tool.pylint.basic]
good-names = [
    "_",
    "_log",
    "b",
    "i",
    "j",
    "k",
    "m",
    "n",
    "p",
    "q",
    "t",
    "u",
    "x",
    "X",
    "X",
    "y",
    "z",
    "ax",
    "df",
    "dm",
    "lb",
    "mu",
    "nu",
    "ub",
    "eta",
]

bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]


[tool.pylint.similarities]
min-similarity-lines = 50

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX"]

[tool.pylint.exceptions]
overgeneral-exceptions = ["builtins.Exception"]

[tool.pylint.design]
max-args = 10
max-positional-arguments = 20
max-attributes = 10
max-bool-expr = 5
max-branches = 12
max-locals = 15
max-parents = 7
max-public-methods = 20
max-returns = 6
